name: quota
version: 2.10.2
description: "Per-provider quota / rate-limit status via /quota command and desktop widget. Reads precomputed quota_cache.json so the widget never does network I/O. Cherry-pick providers in Settings. Nous Portal works on free accounts; Gemini detects tier via loadCodeAssist; Grok reads Hermes xai-oauth subscription usage from the Grok CLI billing endpoint; browser cookies remain an opt-in fallback. Antigravity requires antigravityEnabled=true (default off), reads Windows Credential Manager, macOS Keychain, or the Linux agy token file, refreshes with Antigravity's installed-app OAuth client identity, and sends User-Agent antigravity/2.8.0 windows/amd64. Pane detail: clean or dense."
author: rarf
kind: standalone
provides_commands:
  - quota
